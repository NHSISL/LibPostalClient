version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "CONFIG"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
